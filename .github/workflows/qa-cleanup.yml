name: One-time QA data cleanup

on:
  push:
    branches:
      - main
    paths:
      - .qa-cleanup-trigger

permissions:
  contents: read

jobs:
  reset-shared-firestore:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with Firebase anonymous auth
        env:
          FIREBASE_API_KEY: AIzaSyAd1tvf9Ug0a5EwV36r6HT7k6LhUxEaD40
        run: |
          set -euo pipefail
          AUTH_RESPONSE="$(curl -fsS -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}" -H "Content-Type: application/json" --data '{"returnSecureToken":true}')"
          ID_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["idToken"])' <<< "$AUTH_RESPONSE")"
          echo "::add-mask::$ID_TOKEN"
          echo "FIREBASE_ID_TOKEN=$ID_TOKEN" >> "$GITHUB_ENV"

      - name: Reset shared app state and verify
        env:
          FIREBASE_ID_TOKEN: ${{ env.FIREBASE_ID_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          project = "gen-lang-client-0800757362"
          url = f"https://firestore.googleapis.com/v1/projects/{project}/databases/(default)/documents/mahallu/sharedAppData"
          token = os.environ["FIREBASE_ID_TOKEN"]

          clean_state = {
              "people": [],
              "days": {},
              "rotation": {
                  "startDate": "2026-11-03",
                  "startPersonId": "",
                  "swap": None
              },
              "order": 1
          }

          def encode(value):
              if value is None:
                  return {"nullValue": None}
              if isinstance(value, bool):
                  return {"booleanValue": value}
              if isinstance(value, str):
                  return {"stringValue": value}
              if isinstance(value, int):
                  return {"integerValue": str(value)}
              if isinstance(value, float):
                  return {"doubleValue": value}
              if isinstance(value, list):
                  return {"arrayValue": {"values": [encode(x) for x in value]}}
              if isinstance(value, dict):
                  return {"mapValue": {"fields": {k: encode(v) for k, v in value.items()}}}
              raise TypeError(type(value).__name__)

          payload = {"fields": {"state": encode(clean_state)}}
          request = urllib.request.Request(
              url + "?updateMask.fieldPaths=state",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
              },
              method="PATCH"
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print("Firestore update HTTP:", response.status)

          verify = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + token},
              method="GET"
          )
          with urllib.request.urlopen(verify, timeout=30) as response:
              saved = json.load(response)

          fields = saved["fields"]["state"]["mapValue"]["fields"]
          people = fields["people"]["arrayValue"].get("values", [])
          days = fields["days"]["mapValue"].get("fields", {})
          start_date = fields["rotation"]["mapValue"]["fields"]["startDate"]["stringValue"]
          assert len(people) == 0, f"Expected 0 people, found {len(people)}"
          assert len(days) == 0, f"Expected 0 day records, found {len(days)}"
          assert start_date == "2026-11-03", start_date
          print("Verified Firestore clean state: people=0, days=0, startDate=" + start_date)
          PY
