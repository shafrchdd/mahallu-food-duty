name: Seed temporary area demo people

on:
  push:
    branches:
      - main
    paths:
      - .qa-seed-trigger

permissions:
  contents: read

jobs:
  seed-demo-people:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with Firebase anonymous auth
        env:
          FIREBASE_API_KEY: AIzaSyAd1tvf9Ug0a5EwV36r6HT7k6LhUxEaD40
        run: |
          set -euo pipefail
          AUTH_RESPONSE="$(curl -fsS -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}" -H "Content-Type: application/json" --data '{"returnSecureToken":true}')"
          ID_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["idToken"])' <<< "$AUTH_RESPONSE")"
          echo "::add-mask::$ID_TOKEN"
          echo "FIREBASE_ID_TOKEN=$ID_TOKEN" >> "$GITHUB_ENV"

      - name: Add 3 temporary demo people to every area and verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, datetime

          project = "gen-lang-client-0800757362"
          url = f"https://firestore.googleapis.com/v1/projects/{project}/databases/(default)/documents/mahallu/sharedAppData"
          token = os.environ["FIREBASE_ID_TOKEN"]
          headers = {
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json"
          }

          areas = [
              ("TP", "തോട്ടുങ്ങൽ പള്ളിയാൽ"),
              ("PK", "പള്ളിക്കുന്ന്"),
              ("OV", "ഒടുവങ്കാട്"),
              ("KP", "കുറ്റിപ്പുളി"),
              ("MK", "മന്തോണിക്കുന്ന്"),
              ("NK", "നീലാണ്ടൻക്കുന്ന്"),
              ("MP", "മരുതംപാറ"),
          ]

          def decode(value):
              if "nullValue" in value: return None
              if "booleanValue" in value: return value["booleanValue"]
              if "stringValue" in value: return value["stringValue"]
              if "integerValue" in value: return int(value["integerValue"])
              if "doubleValue" in value: return float(value["doubleValue"])
              if "arrayValue" in value:
                  return [decode(x) for x in value["arrayValue"].get("values", [])]
              if "mapValue" in value:
                  return {k: decode(v) for k, v in value["mapValue"].get("fields", {}).items()}
              return None

          def encode(value):
              if value is None: return {"nullValue": None}
              if isinstance(value, bool): return {"booleanValue": value}
              if isinstance(value, str): return {"stringValue": value}
              if isinstance(value, int): return {"integerValue": str(value)}
              if isinstance(value, float): return {"doubleValue": value}
              if isinstance(value, list): return {"arrayValue": {"values": [encode(x) for x in value]}}
              if isinstance(value, dict): return {"mapValue": {"fields": {k: encode(v) for k, v in value.items()}}}
              raise TypeError(type(value).__name__)

          get_req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(get_req, timeout=30) as response:
                  doc = json.load(response)
              state = decode(doc["fields"]["state"])
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              state = {
                  "people": [],
                  "days": {},
                  "rotation": {"startDate": "", "startPersonId": "", "swap": None},
                  "order": 1
              }

          state.setdefault("people", [])
          state.setdefault("days", {})
          state.setdefault("rotation", {})
          state.setdefault("order", 1)

          existing_demo = {p.get("id") for p in state["people"]}
          next_order = max([int(p.get("order", 0)) for p in state["people"]] + [0]) + 1
          added = []
          phone_index = 1

          for code, area in areas:
              for n in range(1, 4):
                  person_id = f"qa-area-{code.lower()}-{n:02d}"
                  if person_id in existing_demo:
                      phone_index += 1
                      continue
                  person = {
                      "id": person_id,
                      "name": f"TEST_{code}_{n:02d}",
                      "phone": f"000000{phone_index:04d}",
                      "area": area,
                      "order": next_order
                  }
                  state["people"].append(person)
                  added.append(person)
                  next_order += 1
                  phone_index += 1

          state["order"] = next_order
          state["rotation"]["startDate"] = datetime.date.today().isoformat()
          ordered = sorted(
              state["people"],
              key=lambda p: (areas.index(next(x for x in areas if x[1] == p.get("area"))) if any(x[1] == p.get("area") for x in areas) else len(areas), int(p.get("order", 0)))
          )
          if not state["rotation"].get("startPersonId") or not any(
              p["id"] == state["rotation"]["startPersonId"] for p in state["people"]
          ):
              state["rotation"]["startPersonId"] = ordered[0]["id"] if ordered else ""
          else:
              # Begin the demo rotation with the first newly added test person.
              state["rotation"]["startPersonId"] = "qa-area-tp-01"
          state["rotation"]["swap"] = None
          state["rotation"].pop("tempSwap", None)

          payload = {"fields": {"state": encode(state)}}
          patch_req = urllib.request.Request(
              url + "?updateMask.fieldPaths=state",
              data=json.dumps(payload, ensure_ascii=False).encode(),
              headers=headers,
              method="PATCH"
          )
          with urllib.request.urlopen(patch_req, timeout=30) as response:
              print("Firestore write HTTP:", response.status)

          with urllib.request.urlopen(get_req, timeout=30) as response:
              saved_doc = json.load(response)
          saved = decode(saved_doc["fields"]["state"])
          saved_people = saved["people"]
          for code, area in areas:
              rows = [p for p in saved_people if p.get("area") == area]
              qa_rows = [p for p in rows if p.get("id", "").startswith("qa-area-")]
              assert len(qa_rows) == 3, f"{area}: expected 3 QA demo people, found {len(qa_rows)}"
          assert saved["rotation"]["startDate"] == datetime.date.today().isoformat()
          assert saved["rotation"]["startPersonId"] == "qa-area-tp-01"
          print("Verified people total:", len(saved_people))
          print("Verified 7 areas x 3 QA demo people = 21")
          print("Rotation start date:", saved["rotation"]["startDate"])
          print("Rotation start person:", saved["rotation"]["startPersonId"])
          for code, area in areas:
              rows = sorted([p for p in saved_people if p.get("area") == area and p.get("id", "").startswith("qa-area-")], key=lambda p:p["order"])
              print(area + ":", ", ".join(p["name"] + " (" + p["phone"] + ")" for p in rows))
          PY
